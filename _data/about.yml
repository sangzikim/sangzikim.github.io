intro_label: About
intro: My journey in research.

sections:
  - id: life
    title: Life
    subtitle: trying things, finding questions

life_intro:
  - "<strong>TL;DR: Why I want to pursue a PhD.</strong> Unlike many CS students, I spent much of my sophomore year in the public sector, working on technology policy and diplomacy. I believed that shaping the institutions around emerging technologies was a meaningful way to influence how AI affects society."
  - "Over time, however, I became aware of a gap between high-level discussions and the realities of technological development. In a field moving this fast, trying to steer its direction without understanding its current state left too much of the picture missing."
  - "That realization brought me back to research. I came to believe that the most fundamental way to contribute to both society and the field is <strong>to engage directly with the technology itself and help build what comes next</strong>. That is why I want to pursue a PhD."

life_chapters:
  - id: exploring
    era: "~High School (~2020)"
    title: Exploring Before Knowing
    paragraphs:
      - "Until high school, I was probably more interested in art than in technology, and for a while I seriously considered film school. Since middle school, I had been in school broadcasting clubs, where I loved handling cameras, shooting and editing videos, and showing what I had made to others."
      - "One of my biggest high school projects was a [short film](https://www.youtube.com/watch?v=YnsKKiO44rY&t=3s) (2018) for the school arts festival, loosely inspired by the movie *Her* (falling in love with an AI &mdash; in hindsight, quite a coincidence!). With no professional experience, I had a blast hacking together filmmaking techniques from scratch: (1) faking smooth dolly shots by <span class='reveal'><input type='checkbox' id='rv-dolly' class='reveal-toggle'><label for='rv-dolly' class='reveal-box'><span class='reveal-cue'>answer</span><span class='reveal-text'>resting the camera on a sheet of paper and dragging it</span></label></span>, and (2), since CG was out of the question, <span class='reveal'><input type='checkbox' id='rv-rain' class='reveal-toggle'><label for='rv-rain' class='reveal-box'><span class='reveal-cue'>answer</span><span class='reveal-text'>scrambling everyone to shoot our rain scenes whenever it actually started raining</span></label></span>. Armed with nothing but an old school camera, a 2G phone as a microphone, and a bunch of boys talking to a student ID card (yes, that is the plot), we somehow pulled it off after a year of filming."
      - "It was the first time I poured an enormous amount of time and effort into a single project, and the first time I felt that *[we've made something wonderful](https://www.youtube.com/watch?v=pIwlbAaZ3cs)* feeling."
      - "I also loved writing and regularly entered essay competitions. My last essay, &ldquo;What Art Means to a STEM Student,&rdquo; was published in my school's literary journal for future students to read. Inspired by Steve Jobs&rsquo; 2005 Stanford commencement speech on &ldquo;connecting the dots,&rdquo; it argued that art can fill in the gaps of science and technology. You can [read it here](#) (an AI-translated version; I hope my rough thoughts still come through)."
      - "Even in a high-pressure environment focused on exams and admissions, I took quiet pride in chasing seemingly unrelated interests &mdash; film, photography, writing, and whatever else caught my eye &mdash; without a particular major in mind. I felt there were things I could only explore as a student, so I kept reaching for them without knowing how the dots would connect. (Looking back, some of them eventually did, through computer vision and natural language processing.)"
      - "With those dots still unconnected, AI seemed like a natural place to start. Watching [AlphaGo&rsquo;s match against Lee Sedol in 2016](https://deepmind.google/research/alphago/), I remember a fuzzy feeling of science fiction becoming real, and I was fascinated by the idea that machines could replicate parts of human intelligence. Above all, I hoped AI might be where my scattered interests would finally connect. That was enough to send me down the rabbit hole."

  - id: college-air-force
    era: "FRESHMAN & AIR FORCE (~2024)"
    title: Finding What AI Could Be Used For
    paragraphs:
      - "My first year of college did not immediately give me an answer. Still uncertain, I enlisted in the Air Force. Military life felt disconnected from everything I had known, but that isolation also gave me a kind of inner peace &mdash; room to think without comparing myself to others or worrying about outside noise."
      - "I was assigned to the Air Force Operations Command, working with ROK&ndash;U.S. combined communications systems. Things changed when my junior colleague [Edward Song](https://www.linkedin.com/in/edwardjhoon/) (CMU SDS) came to me with a problem his office faced after a [series of incidents](https://www.airandspaceforces.com/videos-usaf-f-16-crash-south-korea/) involving emergency sorties in fall 2023. Together, we began examining the 3-day Air Tasking Order (ATO) production process and searching for solutions."
      - "Due to security restrictions, we worked with whatever scraps we could find &mdash; technical reports, military publications, defense research documents, and even old materials whose publication dates we could barely make out. We also had the rare chance to meet our U.S. Air Force counterparts in the operational planning office and compare how their systems were organized and operated. I still remember the nights Ed and I snuck into the drying room after night shifts, sketching out the system pipeline and arguing over module options using RL, DQNs, and recommender systems."
      - "Eventually, [our proposal](/assets/pdf/AI-based_ATO_Rec_Sys_ENG_ver_SanghoKim.pdf) won first place from the Air Force's New Technology Development Team and the Office of the Commander, and later led to an interview with executives at Palantir Technologies, which was pretty cool. But what stayed with me more was that, for the first time, I had actually used AI to solve a real problem around me. That was when I began to see AI not just as a field to study, but as a general-purpose tool for solving problems."
      - "With that in mind, I entered competitions across public domains such as national defense, healthcare, and diplomacy. Long story short, I found that what I enjoyed most was <strong>the process of problem solving</strong> itself: defining a problem, discussing it, solidifying an idea, and proving that it works."
      - "Much later, I realized that research was not so different."

  - id: policy-research
    era: "POST-SERVICE, SOPHOMORE YEAR (~2025)"
    title: From Government Stuff Back to Research
    paragraphs:
      - "Military service left me with a stronger desire to contribute to something beyond myself. Having watched the world change after ChatGPT's release during my service, I wanted to use this new wave of technology for broader social impact. That is probably why, after being discharged, I joined so many government-related programs and data science competitions."
      - "It did not take long to notice how fragile the bridge between technology and the public sector was in South Korea. My best friend Yongbin, then interning at the Ministry of Foreign Affairs, often stressed his sector's need for professionals with engineering backgrounds. With the AI transformation and all that jazz underway, I felt it was <strong>our generation's role to help lay the groundwork for how these technologies would be adopted and governed</strong>. From afar, that seemed like a meaningful path."
      - "So during my sophomore year, I took on AI policy advisory work at the [Ministry of Science and ICT](https://www.msit.go.kr/bbs/view.do?sCode=user&nttSeqNo=3185384&bbsSeqNo=94), participated in public diplomacy programs (LHC, [YTL](https://jp.usembassy.gov/young-trilateral-leaders-summit-in-osaka-us-japan-korea/), [AHDA](https://kr.usembassy.gov/education-exchanges/american-diplomacy-house/)), and joined discussions on the responsible use of emerging technologies through [TechCamp](https://kr.usembassy.gov/2024techcamp/). Policymaking was a rare &mdash; and slightly scary &mdash; experience, especially when I saw some of my own ideas land directly on policymakers' desks. Diplomacy also meant lots of meetings and new people, which, as an extrovert, I genuinely enjoyed."
      - "But the closer I got, the more cautious I became. As my voice began to carry more weight, I kept asking myself: Am I actually steering things in the right direction, or just nerfing a legendary sword without understanding how it works? Some questions were more basic. Every country seemed desperate to secure NVIDIA GPUs, but what exactly does AI need GPUs for? Surprisingly, the policymakers themselves were asking the same questions."
      - "This knowledge gap between scientists and non-scientists started to bother me. Technical details got lost as they moved up into policy discussions, while researchers' concerns did not always translate into something policymakers could act on. Before trying to shape technology from the outside, I wanted to understand it thoroughly from the inside."
      - "That is how I returned to research. I also wanted to work on something less crowded &mdash; probably an old habit of being drawn to what others were not doing. If AI was meant to resemble human intelligence, I was curious about the soft skills that make us human, rather than only the hard skills like recognition, classification, and generation that were already receiving so much attention."
      - "Luckily, [Professor Lee](https://sites.google.com/view/sangmin-lee/home), my PI at the time, introduced me to <strong>Artificial Social Intelligence</strong>, and I eventually settled on studying <strong>multimodal human interaction</strong>, driven by the following question:"
      - '<blockquote class="about-life-pullquote"><p>How can intelligent machines read the room&mdash;verbally and nonverbally&mdash;like social animals?</p></blockquote>'
      - "I believe solving this problem could unlock unprecedented capabilities for building human-like physical intelligence."

  - id: ut-austin
    era: "EXCHANGE, JUNIOR YEAR (~NOW)"
    title: Toward Social and Physical Intelligence at UT Austin
    paragraphs:
      - "My fully government-funded, one-year exchange at UT Austin is where I developed a clearer vision for answering this question."
      - "In Prof. Grauman&rsquo;s [CS 381V Visual Recognition (Grad)](https://www.cs.utexas.edu/~grauman/courses/fall2025/) and Prof. Pavlakos&rsquo;s [CS 395T Learning for 3D Vision (Grad)](https://sites.google.com/utexas.edu/cs395t-spring2026?pli=1), I encountered new methods in computer vision (e.g., human mesh recovery, scene reconstruction) that gave my research a new direction. Noticing that most work on interaction perception still relies on classical 2D keypoints or implicit representations, I decided to bring 3D/4D vision into this line of work. My research has since focused on three interaction settings:"
      - "<strong>Human&ndash;human interaction.</strong> Project: <em>Modeling Multimodal Social Interaction with 4D Human Body Mesh</em><br>Heavily inspired by [4DHumans](https://shubham-goel.github.io/4dhumans/) and [PHALP](https://arxiv.org/abs/2112.04477), I worked with [Prof. Pavlakos](https://geopavlakos.github.io/) on using 4D human motion and spatial cues for multimodal social deduction tasks, combining spatiotemporal interaction understanding with BERT-style backbones. (Fun fact: this project grew out of an older proposal of mine that my PI rejected back in 2024 because we had no clear idea how to make it work&mdash;it sounded a bit too much like science fiction at the time!)"
      - "<strong>Human&ndash;environment interaction.</strong> Project: <em>3D Deictic Gesture Target Estimation with Human&ndash;Scene Reconstruction</em><br>For my CS 395T final project, I developed GeoGesture, a geometry-aware framework built on [CUT3R](https://cut3r.github.io/) and [Human3R](https://fanegg.github.io/Human3R/). It reconstructs a person and their surroundings from a single RGB image in a shared 3D space, then reasons over that geometry to identify the intended target of a deictic gesture. We showed how explicit 3D reasoning can help social robots better understand people in human-centered environments (even without a word!)."
      - "<strong>Egocentric, personalized experience.</strong> Project: [Personalized Visual Context Learning in Large Multimodal Models](https://vision.cs.utexas.edu/projects/PersonalVCL/)<br>With [Dr. Zihui Xue](https://zihuixue.github.io/) and [Prof. Kristen Grauman](https://www.cs.utexas.edu/~grauman/), I explored how multimodal models can learn from a person&rsquo;s egocentric visual history&mdash;the people they interact with, the objects around them, and their everyday behaviors&mdash;to understand new experiences in a personalized way."
      - "To me, understanding the physical scene beyond the image plane is a natural next step for social intelligence. After all, humans understand one another not only through words, but also through body language, spatial relationships, and their connection with the world around them."
      - "But as my mentor [Evonne Ng](https://evonneng.github.io/) from Meta Superintelligence Labs once put it, “it is a niche topic.” There is still a lot to figure out, yet not enough data to figure it out with."
      - "During my PhD, I want to push this direction further by <strong>(1) building models that understand human interactions</strong> in their physical and social context, and <strong>(2) creating new multimodal datasets and benchmarks</strong> that open up more room for the broader research community to explore this problem."
    # closing_quote: How can we build intelligent machines that understand people, their interactions, and the physical world well enough to meaningfully participate in it?

