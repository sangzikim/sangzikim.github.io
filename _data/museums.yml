# Museum & Gallery Visits — shown as the second chapter of the /art page.
# A year of museum-hopping, logged like the botanical field notebook:
# each visit carries its city, date, and GPS coordinate. Monet works are
# flagged (`monet: true`) — a personal favorite.

kicker: Travel notebook · 2025–2026
title: Museum & Gallery Visits
intro: >
  The other half of this page. I love wandering museums and galleries, so
  over the past year I kept a little logbook of the ones I visited — nine
  collections across the States, pinned by the coordinates where each photo
  was taken. I have a soft spot for Monet, so his paintings are marked in gold.
footnote: >
  Attributions are noted from memory and gallery labels; dates are the day of
  the visit. Coordinates come from each photo's location tag.

visits:
  - museum: The Broad
    city: Los Angeles, CA
    date: 2025-07-31
    coords: 34.0544, −118.2507
    note: >
      Contemporary and Pop under Diller Scofidio + Renfro's honeycomb “veil.”
    photos:
      - image: /assets/img/art_gal/museum/broad-basquiat.jpg
        artist: Jean-Michel Basquiat
        title: Untitled
      - image: /assets/img/art_gal/museum/broad-contemporary.jpg
        caption: Under “the veil” — the third-floor galleries

  - museum: The Getty Center
    city: Los Angeles, CA
    date: 2025-08-05
    coords: 34.0780, −118.4741
    note: >
      Travertine pavilions on a hill above the city — Old Masters and gardens.
    photos:
      - image: /assets/img/art_gal/museum/getty-batoni.jpg
        artist: Pompeo Batoni
        title: Portrait of John Talbot (center)

